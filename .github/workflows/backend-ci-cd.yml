name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch to save runner minutes and avoid deployment race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Stage 1: Code Quality & Syntax Validation
  # ============================================================
  lint-and-validate:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Syntax & Structure Validation
        run: npm test

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

  # ============================================================
  # Stage 2: Integration & Database Health Check
  # ============================================================
  integration-check:
    name: Integration & Mongo Connectivity
    needs: lint-and-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Server Boot & Health Endpoint
        env:
          PORT: 3000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ai_life_manager_test
          JWT_SECRET: test_jwt_secret_key_1234567890_antigravity
          JWT_EXPIRES_IN: 1d
          MONGO_MAX_POOL_SIZE: 20
          MONGO_MIN_POOL_SIZE: 2
        run: |
          node server.js &
          SERVER_PID=$!
          echo "Waiting for server to initialize..."
          sleep 5
          if curl --fail http://localhost:3000/api/health; then
            echo "Server health check passed!"
            kill $SERVER_PID || true
          else
            echo "Server health check failed!"
            kill -9 $SERVER_PID || true
            exit 1
          fi

  # ============================================================
  # Stage 3: Docker Build & Container Registry Push
  # ============================================================
  docker-build:
    name: Docker Build & Push to GHCR
    needs: [lint-and-validate, integration-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image names MUST be strictly lowercase, regardless of GitHub username capitalization
      - name: Prepare Lowercase Image Name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 4: Continuous Deployment Trigger
  # ============================================================
  deploy:
    name: Trigger Production Deployment
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Cloud (Render / Railway / Webhook)
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment webhook..."
          curl -X POST "$DEPLOY_WEBHOOK_URL"
          echo "Deployment triggered successfully!"

      - name: Deployment Instructions Notice
        if: ${{ secrets.DEPLOY_WEBHOOK_URL == '' }}
        run: |
          echo "Notice: DEPLOY_WEBHOOK_URL secret not configured in GitHub Secrets."
          echo "Docker image was successfully built, scanned, and pushed to GHCR."
