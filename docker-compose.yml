services:
  # ============================================================
  # 1. Database: MongoDB 7.0 Service
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: ai_life_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - ai-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================
  # 2. Backend: Express 5 + Multi-LLM API Service
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_life_backend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      # MONGODB_URI comes from env_file (Atlas URI) — no override needed
      # The app sets dns.setServers(["8.8.8.8","1.1.1.1"]) internally for SRV resolution
    env_file:
      - ./backend/.env
    # No depends_on needed when using Atlas (external cloud DB)
    networks:
      - ai-network

  # ============================================================
  # 3. Frontend: React + Vite + Nginx Reverse Proxy
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_life_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ai-network

volumes:
  mongo-data:
    name: ai_life_mongo_data

networks:
  ai-network:
    name: ai_life_network
    driver: bridge
