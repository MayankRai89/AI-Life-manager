name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci-cd.yml"
  workflow_dispatch:

# Cancel in-progress runs for the same branch to save runner minutes and avoid deployment race conditions
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # Stage 1: Code Quality & Syntax Validation
  # ============================================================
  lint-and-validate:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Syntax & Structure Validation
        run: npm test

      - name: Dependency Security Audit
        run: npm audit --audit-level=high || true

  # ============================================================
  # Stage 2: Integration & Database Health Check
  # ============================================================
  integration-check:
    name: Integration & Mongo Connectivity
    needs: lint-and-validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Server Boot & Health Endpoint
        env:
          PORT: 3000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/ai_life_manager_test
          JWT_SECRET: test_jwt_secret_key_1234567890_antigravity
          JWT_EXPIRES_IN: 1d
          MONGO_MAX_POOL_SIZE: 20
          MONGO_MIN_POOL_SIZE: 2
        run: |
          echo "Waiting for MongoDB to be accessible on port 27017..."
          for i in {1..30}; do
            if nc -z localhost 27017; then
              echo "MongoDB is accepting connections!"
              break
            fi
            echo "Waiting for MongoDB... ($i/30)"
            sleep 1
          done

          echo "Starting backend server in test mode..."
          node server.js > server.log 2>&1 &
          SERVER_PID=$!

          echo "Polling /api/health endpoint..."
          SUCCESS=0
          for i in {1..20}; do
            if curl -s -f http://localhost:3000/api/health > /dev/null; then
              echo "Server health check passed on attempt $i!"
              SUCCESS=1
              break
            fi
            echo "Server not ready yet, retrying in 1s... ($i/20)"
            sleep 1
          done

          if [ $SUCCESS -eq 1 ]; then
            echo "Integration check succeeded! Server log snippet:"
            head -n 25 server.log
            kill $SERVER_PID || true
          else
            echo "Integration check failed! Full server logs:"
            cat server.log
            kill -9 $SERVER_PID || true
            exit 1
          fi

  # ============================================================
  # Stage 3: Docker Build & Container Registry Push
  # ============================================================
  docker-build:
    name: Docker Build & Push to GHCR
    needs: [lint-and-validate, integration-check]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker image names MUST be strictly lowercase, regardless of GitHub username capitalization
      - name: Prepare Lowercase Image Name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Stage 4: Continuous Deployment Trigger
  # ============================================================
  deploy:
    name: Trigger Production Deployment
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Cloud (Render / Railway / Webhook)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "Triggering deployment webhook..."
            curl -s -S -X POST "$DEPLOY_WEBHOOK_URL"
            echo "Deployment triggered successfully!"
          else
            echo "Notice: DEPLOY_WEBHOOK_URL secret not configured in GitHub Secrets."
            echo "Docker image was successfully built, scanned, and pushed to GHCR."
          fi
